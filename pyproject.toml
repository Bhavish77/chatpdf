[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Without this, `from app import db` in conftest.py only resolves when
# pytest is invoked as `python -m pytest` (which prepends cwd to sys.path).
# The bare `pytest` console script - what CI runs - does not, and fails
# collection with ModuleNotFoundError: No module named 'app'.
pythonpath = ["."]
